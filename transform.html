<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transform</title>
  </head>
  <body>
    <div class="zoom-effect">
      <img
        src="https://images.pexels.com/photos/1264210/pexels-photo-1264210.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500"
      />
      <div class="content">
        <h3>How about you?</h3>
        <ul style="margin-top: 20px">
          <li>Hi dude,</li>
          <li>Wow! It's Awesome!</li>
        </ul>
      </div>
    </div>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      img {
        width: 100%;
        object-fit: cover;
      }
      .zoom-effect {
        position: relative;
        width: 500px;
        border: 10px solid red;
        transition: all 2s;
        overflow: hidden;
        cursor: pointer;
      }
      .zoom-effect img {
        transition: all 0.8s;
      }
      .zoom-effect:hover img {
        transform: scale(1.5) rotate(12deg) translateX(50%);
      }

      .zoom-effect .content {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        left: 100%;
        transition-delay: 5s;
        transition: all 1s;
        z-index: -10;
      }

      .zoom-effect:hover .content {
        left: 20px;
        z-index: 1;
      }
    </style>
  </body>
</html>
